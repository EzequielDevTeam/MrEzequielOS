name: inspect-lb
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/inspect-lb.yml'

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: Instalar live-build
        run: |
          sudo apt update
          sudo apt install -y live-build
          lb --version 2>&1 | head -2
      - name: Inspecionar stages e temas
        run: |
          echo "=== functions ==="
          ls /usr/share/live/build/functions/ | head -50
          echo "=== quem pede syslinux-themes / gfxboot ==="
          grep -rn "syslinux-themes\|gfxboot" /usr/share/live/build/ | head -20
          echo "=== bootloader default e opcoes ==="
          grep -rn "BOOTLOADER" /usr/share/live/build/functions/defaults.sh | head -10
          echo "=== binary selector ==="
          grep -rn "grub-efi\|syslinux" /usr/share/live/build/functions/binary.sh 2>/dev/null | head -20 || ls /usr/share/live/build/functions/ | grep binary
          echo "=== temas syslinux disponiveis ==="
          find /usr/share/live/build -iname "*theme*" | head -20
